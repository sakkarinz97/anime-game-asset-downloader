[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-game-asset-downloader"
version = "1.0.0"
description = "Multi-game anime/gacha Masterdata & Asset Downloader (Cards, Live2D/Spine, Character art) with Google Drive sync"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
unity = [
    "Pillow>=10.0.0",
    "UnityPy>=1.20.0",
    "brotli>=1.1.0",
]
holodori = [
    "holodori-asset-tools>=1.1.0",
    "Pillow>=10.0.0",
    "UnityPy>=1.25.0",
]
all = [
    "Pillow>=10.0.0",
    "UnityPy>=1.25.0",
    "brotli>=1.1.0",
    "holodori-asset-tools>=1.1.0",
]

[project.scripts]
anime-dl = "main:main"
